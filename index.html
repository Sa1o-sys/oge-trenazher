<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тренажёр ОГЭ: грамматика английского</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px">
      <div class="spinner"></div>
      <p style="color:var(--text-muted);font-size:0.9rem">Загрузка...</p>
    </div>
  </div>

  <!-- Модальное окно подтверждения -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <p class="modal-text">Вы уверены, что хотите сбросить весь прогресс? Это действие нельзя отменить.</p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-secondary">Отмена</button>
        <button id="modal-confirm" class="btn btn-danger">Да, сбросить</button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
